apiVersion: 1

datasources:
  - name: Krain MySQL
    uid: krain-mysql
    type: mysql
    access: proxy
    url: mysql:3306
    database: krain
    user: grafana
    isDefault: true
    editable: false
    jsonData:
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    secureJsonData:
      password: GrafanaRead!ChangeMe
