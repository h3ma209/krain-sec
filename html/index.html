<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krain Security — Sign In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #e2e8f0;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 2.5rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .logo p {
      margin-top: 0.5rem;
      font-size: 0.875rem;
      color: #94a3b8;
    }

    label {
      display: block;
      margin-bottom: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      margin-bottom: 1.25rem;
      font-size: 0.9375rem;
      color: #f1f5f9;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: #3b82f6;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      font-size: 0.9375rem;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
    }

    .error {
      display: none;
      margin-bottom: 1rem;
      padding: 0.625rem 0.875rem;
      font-size: 0.875rem;
      color: #fca5a5;
      background: #450a0a;
      border: 1px solid #7f1d1d;
      border-radius: 6px;
    }

    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Krain Security</h1>
      <p>Sign in to your account</p>
    </div>

    <div id="error" class="error">Invalid username or password.</div>

    <form method="POST" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>

      <button type="submit">Sign In</button>
    </form>

    <p class="footer">&copy; 2026 Krain Security. All rights reserved.</p>
  </div>

  <script>
    if (window.location.search.includes("error=1")) {
      document.getElementById("error").classList.add("show");
    }
  </script>
</body>
</html>
