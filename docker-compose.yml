# Sidecar honeypot next to a real site on the same host.
# Inbound published ports work; internal network blocks outbound (no pivot to DB/LAN).
services:
  krain-sec:
    build: .
    container_name: corp-prod-srv05
    hostname: CORP-PROD-SRV05
    env_file:
      - .env
    environment:
      LOG_DIR: /app/logs
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
      HONEYTOKEN_BASE_URL: ${HONEYTOKEN_BASE_URL:-http://127.0.0.1:8080}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-40}
      RATE_LIMIT_LOGIN_RPM: ${RATE_LIMIT_LOGIN_RPM:-8}
      RATE_LIMIT_TRAP_RPM: ${RATE_LIMIT_TRAP_RPM:-20}
      RATE_LIMIT_TELEMETRY_RPM: ${RATE_LIMIT_TELEMETRY_RPM:-60}
      MAX_HTTP_INFLIGHT: ${MAX_HTTP_INFLIGHT:-64}
      MAX_MYSQL_DECOY: ${MAX_MYSQL_DECOY:-16}
      MAX_SSH_SESSIONS: ${MAX_SSH_SESSIONS:-32}
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "8080:8080"   # bait console (proxy vhost here if you want)
      - "22:22"       # decoy SSH on the port scanners hit — move real SSH elsewhere
      - "3306:3306"   # MySQL decoy
      - "3000:3000"   # Grafana decoy
    volumes:
      - ./logs:/app/logs
    networks:
      - honey
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped

networks:
  honey:
    internal: true
