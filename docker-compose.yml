services:
  krain-sec:
    build: .
    container_name: corp-prod-srv05
    hostname: CORP-PROD-SRV05
    ports:
      - "8080:8080"
      - "2222:2222"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: corp-prod-mysql01
    hostname: CORP-PROD-MYSQL01
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CorpRoot!ChangeMe}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-krain}
      MYSQL_USER: ${MYSQL_USER:-krain}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CorpApp!ChangeMe}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: corp-prod-graf01
    hostname: CORP-PROD-GRAF01
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: ""
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  grafana_data:
